services:
  dwh_pipeline:
    build:
      context: .
      dockerfile: dockerfile.dwh
    ports:
      - "3000:3000"
    env_file:
      - .env
    image: ${ACR_LOGIN_SERVER}/dwh_pipeline:latest # image for Azure
    

  dashboard:
    build:
      context: .
      dockerfile: dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    image: ${ACR_LOGIN_SERVER}/dashboard:latest # image for Azure

